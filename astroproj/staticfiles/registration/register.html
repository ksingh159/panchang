{% extends 'base.html' %}
{% load static %}
{% load socialaccount %}

{% block title %}Register - Vedic Astro{% endblock %}

{% block content %}
<div class="content-section" style="max-width: 500px; margin: 30px auto;">
    <h2 style="text-align: center; color: #8b4513; margin-bottom: 30px;">Create Your Account</h2>

    <!-- Manual Registration Form -->
    <form method="post">
        {% csrf_token %}
        
        <div style="margin-bottom: 20px;">
            <label style="display: block; margin-bottom: 5px; color: #8b4513; font-weight: bold;">Full Name:</label>
            <input type="text" name="full_name" style="width: 100%; padding: 10px; border: 2px solid #d2691e; border-radius: 5px;" required>
        </div>
        
        <div style="margin-bottom: 20px;">
            <label style="display: block; margin-bottom: 5px; color: #8b4513; font-weight: bold;">Email:</label>
            <input type="email" name="email" style="width: 100%; padding: 10px; border: 2px solid #d2691e; border-radius: 5px;" required>
        </div>
        
        <div style="margin-bottom: 20px;">
            <label style="display: block; margin-bottom: 5px; color: #8b4513; font-weight: bold;">Password:</label>
            <input type="password" name="password1" style="width: 100%; padding: 10px; border: 2px solid #d2691e; border-radius: 5px;" required>
        </div>
        
        <div style="margin-bottom: 20px;">
            <label style="display: block; margin-bottom: 5px; color: #8b4513; font-weight: bold;">Confirm Password:</label>
            <input type="password" name="password2" style="width: 100%; padding: 10px; border: 2px solid #d2691e; border-radius: 5px;" required>
        </div>

        <!-- Location Selection -->
        <div style="margin-bottom: 20px;">
            <label style="display: block; margin-bottom: 5px; color: #8b4513; font-weight: bold;">Your City:</label>
            <select name="city" id="city-select" style="width: 100%; padding: 10px; border: 2px solid #d2691e; border-radius: 5px;" required>
                <option value="">Select your city</option>
                <!-- Options will be populated by JavaScript -->
            </select>
        </div>

        <div id="custom-location" style="display: none; margin-bottom: 20px;">
            <div style="margin-bottom: 10px;">
                <label style="display: block; margin-bottom: 5px; color: #8b4513; font-weight: bold;">Latitude:</label>
                <input type="number" step="any" name="latitude" id="latitude" style="width: 100%; padding: 10px; border: 2px solid #d2691e; border-radius: 5px;">
            </div>
            <div style="margin-bottom: 10px;">
                <label style="display: block; margin-bottom: 5px; color: #8b4513; font-weight: bold;">Longitude:</label>
                <input type="number" step="any" name="longitude" id="longitude" style="width: 100%; padding: 10px; border: 2px solid #d2691e; border-radius: 5px;">
            </div>
        </div>

        <button type="submit" style="width: 100%; padding: 12px; background: linear-gradient(135deg, #8b4513, #d2691e); color: white; border: none; border-radius: 5px; font-size: 16px; cursor: pointer; margin-bottom: 15px;">
            Create Account
        </button>
    </form>
    <div style="text-align: center; margin: 20px 0;">
        <hr style="border: 0; border-top: 1px solid #d2691e; margin-bottom: 15px;">
        <p style="color: #8b4513; font-weight: bold;">Or Sign up with</p>
        <a href="{% provider_login_url 'google' process='login' %}"
        style="display: inline-block; background: white; border: 2px solid #d2691e; border-radius: 5px; padding: 10px 20px; text-decoration: none; color: #444; font-weight: bold;">
            <img src="https://developers.google.com/identity/images/g-logo.png" 
                alt="Google logo" width="20" style="vertical-align: middle; margin-right: 8px;">
            
        </a>
    </div>

    
    <div style="text-align: center;">
        <p>Already have an account? <a href="{% url 'login' %}" style="color: #d2691e;">Login here</a></p>
    </div>
</div>

<script>
// Indian cities data
const indianCities = [
    {name: "Mumbai", lat: 19.0760, lon: 72.8777, state: "Maharashtra"},
    {name: "Delhi", lat: 28.6139, lon: 77.2090, state: "Delhi"},
    {name: "Bangalore", lat: 12.9716, lon: 77.5946, state: "Karnataka"},
    {name: "Hyderabad", lat: 17.3850, lon: 78.4867, state: "Telangana"},
    {name: "Chennai", lat: 13.0827, lon: 80.2707, state: "Tamil Nadu"},
    {name: "Kolkata", lat: 22.5726, lon: 88.3639, state: "West Bengal"},
    {name: "Pune", lat: 18.5204, lon: 73.8567, state: "Maharashtra"},
    {name: "Ahmedabad", lat: 23.0225, lon: 72.5714, state: "Gujarat"},
    {name: "Jaipur", lat: 26.9124, lon: 75.7873, state: "Rajasthan"},
    {name: "Lucknow", lat: 26.8467, lon: 80.9462, state: "Uttar Pradesh"},
    {name: "Varanasi", lat: 25.3176, lon: 82.9739, state: "Uttar Pradesh"},
    {name: "Patna", lat: 25.5941, lon: 85.1376, state: "Bihar"},
    {name: "Bhopal", lat: 23.2599, lon: 77.4126, state: "Madhya Pradesh"},
    {name: "Chandigarh", lat: 30.7333, lon: 76.7794, state: "Chandigarh"},
    {name: "Dehradun", lat: 30.3165, lon: 78.0322, state: "Uttarakhand"}
];

// Populate city dropdown
const citySelect = document.getElementById('city-select');
indianCities.forEach(city => {
    const option = document.createElement('option');
    option.value = city.name;
    option.textContent = `${city.name}, ${city.state}`;
    option.setAttribute('data-lat', city.lat);
    option.setAttribute('data-lon', city.lon);
    citySelect.appendChild(option);
});

// Add custom location option
const customOption = document.createElement('option');
customOption.value = 'custom';
customOption.textContent = 'Other (Enter custom coordinates)';
citySelect.appendChild(customOption);

// Handle city selection
citySelect.addEventListener('change', function() {
    const customLocationDiv = document.getElementById('custom-location');
    
    if (this.value === 'custom') {
        customLocationDiv.style.display = 'block';
    } else {
        customLocationDiv.style.display = 'none';
        // Auto-fill coordinates for selected city
        const selectedOption = this.options[this.selectedIndex];
        if (selectedOption.value) {
            document.getElementById('latitude').value = selectedOption.getAttribute('data-lat');
            document.getElementById('longitude').value = selectedOption.getAttribute('data-lon');
        }
    }
});
</script>
{% endblock %}
