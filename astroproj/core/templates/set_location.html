{% extends 'panchang.html' %}

{% block content %}
<div class="container" style="max-width: 600px; margin: 50px auto;">
    <div class="card">
        <h2 style="color: #8b4513; margin-bottom: 20px;">Set Your Location</h2>
        <form method="POST">
            {% csrf_token %}
            <div style="margin-bottom: 15px;">
                <label>City:</label>
                <input type="text" name="city" value="{{ request.session.city|default:'Mumbai' }}" required 
                       style="width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px;">
            </div>
            <div style="margin-bottom: 15px;">
                <label>Latitude:</label>
                <input type="number" step="0.0001" name="latitude" value="{{ request.session.lat|default:'19.0760' }}" required
                       style="width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px;">
            </div>
            <div style="margin-bottom: 15px;">
                <label>Longitude:</label>
                <input type="number" step="0.0001" name="longitude" value="{{ request.session.lon|default:'72.8777' }}" required
                       style="width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px;">
            </div>
            <div style="margin-bottom: 15px;">
                <label>Timezone:</label>
                <select name="timezone" style="width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px;">
                    <option value="Asia/Kolkata">Asia/Kolkata (IST)</option>
                    <option value="America/New_York">America/New_York (EST)</option>
                    <option value="Europe/London">Europe/London (GMT)</option>
                    <!-- Add more timezones as needed -->
                </select>
            </div>
            <button type="submit" style="background: #8b4513; color: white; padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer;">
                Save Preferences
            </button>
        </form>
    </div>
</div>
{% endblock %}
