{% extends 'base.html' %}

{% block title %}Login - Vedic Astro{% endblock %}

{% block content %}
<div class="content-section" style="max-width: 400px; margin: 50px auto;">
    <h2 style="text-align: center; color: #8b4513; margin-bottom: 30px;">Login to Vedic Astro</h2>
    
    {% if form.errors %}
    <div class="error-message">
        Your username and password didn't match. Please try again.
    </div>
    {% endif %}
    
    <form method="post">
        {% csrf_token %}
        
        <div style="margin-bottom: 20px;">
            <label style="display: block; margin-bottom: 5px; color: #8b4513; font-weight: bold;">Username:</label>
            <input type="text" name="username" style="width: 100%; padding: 10px; border: 2px solid #d2691e; border-radius: 5px;" required>
        </div>
        
        <div style="margin-bottom: 20px;">
            <label style="display: block; margin-bottom: 5px; color: #8b4513; font-weight: bold;">Password:</label>
            <input type="password" name="password" style="width: 100%; padding: 10px; border: 2px solid #d2691e; border-radius: 5px;" required>
        </div>
        
        <button type="submit" style="width: 100%; padding: 12px; background: linear-gradient(135deg, #8b4513, #d2691e); color: white; border: none; border-radius: 5px; font-size: 16px; cursor: pointer;">
            Login
        </button>
        
        <input type="hidden" name="next" value="{{ next }}">
    </form>
    
    <div style="text-align: center; margin-top: 20px;">
        <p>Don't have an account? <a href="{% url 'register' %}" style="color: #d2691e;">Register here</a></p>
    </div>
</div>
{% endblock %}
