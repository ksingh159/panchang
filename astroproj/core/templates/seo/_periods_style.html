{% load vp %}<style nonce="{{ csp_nonce }}">
  /* Choghadiya / hora rows: stacked cards, readable on a phone without sideways scrolling */
  .periods .sun-row { display:flex; flex-wrap:wrap; gap:8px 16px; font-size:14px; color:#555; margin:10px 0 4px; }
  .periods .plist { display:grid; gap:8px; grid-template-columns:repeat(auto-fill, minmax(300px, 1fr)); }
  .periods .prow { background:#fff; border:1px solid #ecdfca; border-left:5px solid #d9c3a0; border-radius:8px;
    padding:10px 12px; display:grid; grid-template-columns:auto 1fr; gap:2px 12px; align-items:baseline; }
  .periods .prow.k-good { border-left-color:#2e8b57; }
  .periods .prow.k-neutral { border-left-color:#d4a017; }
  .periods .prow.k-avoid { border-left-color:#c0392b; }
  .periods .ptime { font-weight:700; color:#6b3410; white-space:nowrap; font-variant-numeric:tabular-nums; }
  .periods .pname { font-weight:600; }
  .periods .pgood { grid-column:1 / -1; color:#555; font-size:13px; line-height:1.5; }
  .periods .prow.now { background:#fff4d6; box-shadow:0 0 0 2px #e0a800; }
  .periods .prow.now .ptime::after { content:" ● {{ T.now|pick }}"; color:#b8860b; font-size:12px; }
  .periods .now-card { background:linear-gradient(135deg,#fff4d6,#ffe9b8); border-color:#e8c48f; text-align:center; }
  .periods .now-name { font-size:24px; font-weight:700; color:#6b3410; margin:2px 0; }
  .periods .now-time { color:#6b3410; }
  @media (max-width:600px) { .periods .plist { grid-template-columns:1fr; } .periods .now-name { font-size:21px; } }
</style>
